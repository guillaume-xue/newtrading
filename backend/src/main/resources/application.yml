spring:
  cache:
    type: caffeine
    cache-names:
      - stockHistory
      - stockQuote
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false
  data:
    web:
      pageable:
        page-serialization-mode: via-dto

application:
  trading:
    default-initial-balance: 10000.00000000
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000
  marketdata:
    simulator:
      enabled: ${MARKET_DATA_SIMULATOR_ENABLED:false}
    provider: ${MARKET_DATA_PROVIDER:polygon}
    polygon:
      base-url: https://api.polygon.io
      api-key: ${POLYGON_API_KEY:demo}
    alpha-vantage:
      base-url: https://www.alphavantage.co
      api-key: ${ALPHA_VANTAGE_API_KEY:demo}
    finnhub:
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:demo}

resilience4j:
  ratelimiter:
    instances:
      polygonApi:
        limitForPeriod: 5               # Plafond Polygon Free : 5 req
        limitRefreshPeriod: 60s         # Fenêtre de rafraîchissement : 1 minute
        timeoutDuration: 5s             # Temps d'attente maximum d'un thread avant rejet
  circuitbreaker:
    instances:
      polygonApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50        # Si 50% d'erreurs (5xx/timeouts), ouverture du circuit
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
