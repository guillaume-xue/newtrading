server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# En production, on peut restreindre ou couper Swagger UI si besoin
springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.newtrading: INFO
