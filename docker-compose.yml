services:
  # Conteneur 1 : Base de données PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: newtrading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newtrading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtrading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur 2 : API Spring Boot
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtrading_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/newtrading
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secretpassword
      # Les variables POLYGON_API_KEY, MARKET_DATA_PROVIDER et MARKET_DATA_SIMULATOR_ENABLED
      # sont maintenant chargées automatiquement depuis backend/.env
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
